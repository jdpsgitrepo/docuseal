<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- JD Pools: Thai Word documents use the Thai government fonts, which aren't free to ship.
     Laksaman (TLWG) is drawn to TH SarabunPSK's metrics, so converted PDFs keep their line breaks
     and page count. Other Thai fonts fall back to Noto Sans Thai. See lib/jdpools/office_upload.rb. -->
<fontconfig>
  <alias binding="same"><family>TH SarabunPSK</family><prefer><family>Laksaman</family></prefer></alias>
  <alias binding="same"><family>TH Sarabun PSK</family><prefer><family>Laksaman</family></prefer></alias>
  <alias binding="same"><family>TH Sarabun New</family><prefer><family>Laksaman</family></prefer></alias>
  <alias binding="same"><family>Sarabun</family><prefer><family>Laksaman</family></prefer></alias>
  <alias binding="same"><family>Angsana New</family><prefer><family>Noto Sans Thai</family></prefer></alias>
  <alias binding="same"><family>AngsanaUPC</family><prefer><family>Noto Sans Thai</family></prefer></alias>
  <alias binding="same"><family>Cordia New</family><prefer><family>Noto Sans Thai</family></prefer></alias>
  <alias binding="same"><family>CordiaUPC</family><prefer><family>Noto Sans Thai</family></prefer></alias>
  <alias binding="same"><family>Browallia New</family><prefer><family>Noto Sans Thai</family></prefer></alias>
  <alias binding="same"><family>Leelawadee</family><prefer><family>Noto Sans Thai</family></prefer></alias>
  <alias binding="same"><family>Leelawadee UI</family><prefer><family>Noto Sans Thai</family></prefer></alias>
</fontconfig>
