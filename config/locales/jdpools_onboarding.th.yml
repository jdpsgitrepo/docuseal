  jdp_guide:
    title: "วิธีใช้งาน JD e-Sign"
    subtitle: "ทุกอย่างที่ต้องรู้เพื่อส่งเอกสารฉบับแรก ใช้เวลาประมาณห้านาที"
    contents: "สารบัญ"
    admin_badge: "ผู้ดูแลระบบ IT"
    help: "ยังติดปัญหา? อีเมลถึง it-service@jdpools.com ฝ่าย IT ยินดีช่วย"
    sections:
      - id: what
        title: "JD e-Sign ใช้ทำอะไร"
        body:
          - "JD e-Sign ใช้แทนการพิมพ์ เซ็นด้วยมือ แล้วสแกนกลับ คุณอัปโหลดเอกสาร กำหนดจุดที่ต้องลงนาม แล้วส่ง ผู้รับลงนามได้จากมือถือหรือคอมพิวเตอร์ และทุกคนได้รับไฟล์ PDF ที่ลงนามแล้วทางอีเมล"
          - "ผู้รับเอกสารไม่ต้องมีบัญชี ไม่ต้องติดตั้งแอป และไม่ต้องใช้ Adobe เพียงเปิดลิงก์ในอีเมล"
          - "คุณเห็นเอกสารที่ทุกคนในแผนกของคุณส่ง แผนกอื่นไม่เห็นเอกสารของคุณ ส่วนผู้ดูแลระบบ IT เห็นทั้งหมด"
      - id: first
        title: "ส่งเอกสารฉบับแรก"
        steps:
          - "ที่หน้า Document Templates คลิก Upload (หรือลากไฟล์ PDF หรือ Word มาวางบนหน้า)"
          - "เอกสารจะเปิดในหน้าแก้ไข ด้านขวาเลือกประเภทช่อง (Signature, Date, Text...) แล้วลากไปวางบนหน้าเอกสารในตำแหน่งที่ต้องการ"
          - "แต่ละสีคือผู้ลงนามหนึ่งคน ถ้ามีผู้ลงนามมากกว่าหนึ่งคน ให้เพิ่มคู่สัญญา (party) ที่มุมขวาบน เช่น Employee, Manager แล้ววางช่องของแต่ละคน"
          - "คลิก Save แล้วคลิก Send"
          - "พิมพ์อีเมลของผู้ลงนาม (คู่สัญญาละหนึ่งอีเมล) แล้วคลิก Add recipients ผู้รับจะได้รับอีเมลจาก it-service@jdpools.com ทันที"
        body:
          - "เท่านี้เอง เมื่อทุกคนลงนามครบ คุณและผู้ลงนามทุกคนจะได้รับไฟล์ PDF ฉบับสมบูรณ์พร้อมบันทึกการตรวจสอบ"
      - id: templates
        title: "ใช้เอกสารซ้ำเป็นแม่แบบ"
        body:
          - "เอกสารทุกฉบับที่อัปโหลดจะเก็บไว้เป็นแม่แบบ (template) ครั้งต่อไปเปิดจาก Document Templates แล้วคลิก Send ได้เลย ไม่ต้องวางช่องใหม่"
          - "เหมาะกับเอกสารการจ้างงาน แบบฟอร์มส่งมอบ หนังสือรับทราบ NDA และเอกสารที่ส่งบ่อย"
          - "ใช้ Clone เพื่อทำฉบับดัดแปลงโดยไม่แก้ต้นฉบับ และ Archive เพื่อเก็บแม่แบบที่ไม่ใช้แล้ว"
      - id: order
        title: "ผู้ลงนามหลายคน และลำดับการลงนาม"
        body:
          - "เพิ่มคู่สัญญาหนึ่งรายการต่อผู้ลงนามหนึ่งคน (Employee, Manager, HR...) แต่ละคนเห็นและกรอกเฉพาะช่องของตนเอง"
          - "ค่าเริ่มต้นคือเชิญทีละคนตามลำดับคู่สัญญา คนถัดไปจะได้รับอีเมลเมื่อคนก่อนหน้าลงนามเสร็จ หากต้องการเชิญทุกคนพร้อมกัน ให้เอาเครื่องหมายออกจาก Preserve order ในหน้าต่าง Send"
      - id: yourself
        title: "ลงนามเอกสารด้วยตนเอง"
        body:
          - "ถ้าคุณเป็นหนึ่งในผู้ลงนาม เปิดแม่แบบแล้วคลิก Sign it yourself หรือคลิก Sign now ข้างชื่อของคุณในรายการ"
      - id: track
        title: "ติดตามสถานะและรับฉบับที่ลงนามแล้ว"
        body:
          - "เปิดแม่แบบเพื่อดูรายการเอกสารที่ส่ง แต่ละรายการแสดงสถานะ Sent, Opened, Completed หรือ Declined"
          - "ยังไม่มีใครลงนาม? ใช้ Copy link เพื่อส่งลิงก์ทาง LINE หรือ Teams หรือส่งอีเมลซ้ำ"
          - "เมื่อเสร็จสมบูรณ์ เปิดรายการแล้วคลิก Download เพื่อรับไฟล์ PDF ที่ลงนามแล้ว บันทึกการตรวจสอบแสดงว่าใครลงนาม เมื่อใด และจากอุปกรณ์ใด"
      - id: reminders
        title: "การแจ้งเตือน"
        body:
          - "JD e-Sign ส่งอีเมลแจ้งเตือนผู้ที่ยังไม่ลงนามได้ ฝ่าย IT ตั้งกำหนดเวลาครั้งเดียวสำหรับทุกคน (เช่น หลัง 2 วันและ 5 วัน) หากต้องการกำหนดเวลาอื่นให้แจ้งฝ่าย IT"
      - id: thai
        title: "เอกสารภาษาไทย"
        body:
          - "เขียนข้อความภาษาไทยในไฟล์ Word หรือ PDF ก่อนอัปโหลด แล้วใช้ช่องของ JD e-Sign สำหรับลายเซ็น วันที่ ชื่อย่อ และช่องทำเครื่องหมาย"
          - "ผู้ลงนามที่ตั้งภาษามือถือเป็นภาษาไทยจะเห็นหน้าลงนามเป็นภาษาไทย ข้อความภาษาไทยที่พิมพ์ในช่องข้อความจะแสดงถูกต้องในไฟล์ PDF ที่ลงนามแล้ว"
      - id: faq
        title: "คำถามที่พบบ่อย"
        qa:
          - q: "ลายมือชื่ออิเล็กทรอนิกส์มีผลทางกฎหมายหรือไม่?"
            a: "พระราชบัญญัติว่าด้วยธุรกรรมทางอิเล็กทรอนิกส์รับรองลายมือชื่ออิเล็กทรอนิกส์สำหรับเอกสารธุรกิจและการจ้างงานทั่วไป และไฟล์ PDF ที่ลงนามแล้วทุกฉบับมีลายมือชื่อดิจิทัลและบันทึกการตรวจสอบ เอกสารบางประเภท (เช่น การยื่นต่อหน่วยงานราชการบางแห่ง เรื่องที่ดินและครอบครัว) ยังต้องเซ็นด้วยมือ หากไม่แน่ใจให้สอบถามฝ่ายบุคคลหรือฝ่ายกฎหมาย"
          - q: "ผู้ลงนามบอกว่าไม่ได้รับอีเมล"
            a: "ให้ตรวจสอบโฟลเดอร์ Junk ก่อน แล้วใช้ Copy link ที่รายการเอกสารเพื่อส่งลิงก์ให้โดยตรง"
          - q: "ส่งผิดคนหรือส่งผิดไฟล์"
            a: "Archive รายการนั้น ลิงก์จะใช้งานไม่ได้ทันที แล้วส่งฉบับที่ถูกต้องใหม่"
          - q: "ใครเห็นเอกสารของฉันบ้าง?"
            a: "คุณ ทุกคนในแผนกเดียวกันตาม Entra และผู้ดูแลระบบ IT"
      - id: admin
        title: "สำหรับผู้ดูแลระบบ IT"
        admin: true
        body:
          - "ให้สิทธิ์ผู้ใช้: ใน Entra ไปที่ Enterprise apps → JD Pools DocuSeal → Users and groups แล้วกำหนด DocuSeal Sender (หรือ DocuSeal Admin) แผนกมาจากโปรไฟล์ Entra จึงต้องตั้งให้ถูกต้อง บัญชีจะถูกสร้างเมื่อเข้าสู่ระบบครั้งแรก"
          - "การตั้งค่าที่ควรทำครั้งเดียว: Notifications (กำหนดการแจ้งเตือน), Personalization (ข้อความอีเมลเชิญและอีเมลเมื่อเสร็จสมบูรณ์ แนะนำให้ใช้สองภาษาไทย/อังกฤษ), E-Signature (ใบรับรองสำหรับลงนาม)"
          - "การเข้าสู่ระบบด้วยรหัสผ่านใช้ได้เฉพาะบัญชีฉุกเฉิน ทุกคนใช้ Sign in with Microsoft"

  jdp_signer_help:
    title: "วิธีลงนามเอกสาร"
    lede: "มีผู้ส่งเอกสารจาก J.D. Pools ให้คุณลงนาม ใช้เวลาประมาณสองนาที ผ่านมือถือหรือคอมพิวเตอร์"
    steps_title: "ขั้นตอน"
    steps:
      - "เปิดอีเมลจาก J.D. Pools (it-service@jdpools.com) แล้วแตะ Review and Sign"
      - "อ่านเอกสาร ส่วนที่คุณต้องกรอกจะถูกไฮไลต์ไว้"
      - "กรอกแต่ละช่องแล้วแตะ ถัดไป สำหรับลายเซ็น วาดด้วยนิ้วหรือเมาส์ หรือแตะ พิมพ์ เพื่อพิมพ์ชื่อ"
      - "แตะ เสร็จสิ้น (หรือ ลงนามและเสร็จสิ้น) ในขั้นตอนสุดท้าย"
      - "คุณจะได้รับฉบับที่ลงนามแล้วทางอีเมล และดาวน์โหลดได้ทันที"
    tips_title: "ควรรู้"
    tips:
      - "ไม่ต้องมีบัญชี ไม่ต้องใช้รหัสผ่าน และไม่ต้องติดตั้งแอป"
      - "ภาษาของหน้าลงนามเป็นไปตามภาษาของมือถือคุณ: ไทยหรืออังกฤษ"
      - "หากคุณไม่ควรเป็นผู้ลงนาม แตะ ปฏิเสธ และระบุเหตุผล ผู้ส่งจะได้รับแจ้ง"
      - "คำขอจริงมาจาก it-service@jdpools.com และเปิดที่ sign.jdpoolstech.com หากลิงก์ดูแปลกไป อย่ากดใช้"
    help: "มีคำถามเกี่ยวกับเอกสาร? ตอบกลับอีเมลเชิญ หรือติดต่อผู้ส่งเอกสาร"
    back: "กลับไปหน้าเข้าสู่ระบบ"

