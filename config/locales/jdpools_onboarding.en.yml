    select_a_signer_party_description: "Each signer is a party (Employee, Manager...). Pick one here, or add another if the document needs more than one signature."
    available_parties_description: "The parties on this document. Select one, then place that person's fields."
    available_field_types_description: "Drag these onto the page: Signature, Date, Text, Checkbox and more."
    text_input_field_description: "For names, IDs or any short text the signer types in."
    signature_field_description: "Where the signer signs: they draw it or type it."
    added_fields_description: "Every field you have placed. Reorder, edit or remove them here."
    field_settings_description: "Make a field required, add a hint for the signer, or change its size."
    send_document_description: "When the fields are placed, click Send and enter each signer's email."
    sign_yourself_description: "If you are one of the signers, sign it yourself here."
